<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Clientes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background-color: #DBB8BC;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.8em;
        }

        .btn-menu {
            background-color: white;
            color: #DBB8BC;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-menu:hover {
            background-color: #f1f1f1;
        }

        .content {
            padding: 20px;
        }

        .form-section, .search-section, .list-section {
            margin-bottom: 20px;
            padding: 20px;
            background-color: #fafafa;
            border-radius: 8px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input, .form-group select {
            padding: 10px;
            border: 2px solid #DBB8BC;
            border-radius: 5px;
            font-size: 14px;
        }

        .btn {
            background-color: #DBB8BC;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn:hover {
            background-color: #c9a4a9;
        }

        .search-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 200px;
            padding: 10px;
            border: 2px solid #DBB8BC;
            border-radius: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #DBB8BC;
            color: white;
        }

        .status-active {
            color: green;
            font-weight: bold;
        }

        .status-inactive {
            color: red;
            font-weight: bold;
        }

        .delete-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background-color: #c82333;
        }

        .no-results {
            text-align: center;
            padding: 20px;
            color: #888;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Lista de Clientes</h1>
            <a href="menu.html" class="btn-menu">Volver al Menú</a>
        </div>

        <div class="content">
            <div class="form-section">
                <h2>Agregar Cliente</h2>
                <form id="clientForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>ID Cliente:</label>
                            <input type="text" id="idCliente" required>
                        </div>
                        <div class="form-group">
                            <label>Nombre Completo:</label>
                            <input type="text" id="nombreCompleto" required>
                        </div>
                        <div class="form-group">
                            <label>Correo:</label>
                            <input type="email" id="correo" required>
                        </div>
                        <div class="form-group">
                            <label>Teléfono:</label>
                            <input type="text" id="telefono" required>
                        </div>
                        <div class="form-group">
                            <label>Número de Tarjeta:</label>
                            <input type="text" id="numeroTarjeta" required>
                        </div>
                        <div class="form-group">
                            <label>Estado de Tarjeta:</label>
                            <select id="estadoTarjeta" required>
                                <option value="">Seleccione</option>
                                <option value="Activo">Activo</option>
                                <option value="Desactivada">Desactivada</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Monto en Tarjeta ($):</label>
                            <input type="number" id="montoTarjeta" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label>Puntos Acumulados:</label>
                            <input type="number" id="puntosAcumulados" required>
                        </div>
                    </div>
                    <button type="submit" class="btn" style="margin-top: 15px;">Agregar Cliente</button>
                </form>
            </div>

            <div class="search-section">
                <h2>Buscar Cliente</h2>
                <div class="search-container">
                    <input type="text" id="searchId" class="search-input" placeholder="Buscar por ID...">
                    <input type="text" id="searchNombre" class="search-input" placeholder="Buscar por Nombre...">
                    <button onclick="filtrarClientes()" class="btn">Buscar</button>
                    <button onclick="limpiarFiltros()" class="btn" style="background-color: #6c757d;">Limpiar</button>
                </div>
            </div>

            <div class="list-section">
                <h2>Clientes Registrados</h2>
                <div id="noResults" class="no-results" style="display: none;">No se encontraron clientes.</div>
                <table id="clientesTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Correo</th>
                            <th>Teléfono</th>
                            <th>Tarjeta</th>
                            <th>Estado</th>
                            <th>Monto</th>
                            <th>Puntos</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="clientesTableBody">
                        <!-- Se llena dinámicamente -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const clientes = JSON.parse(localStorage.getItem('clientes')) || [];

        function guardarClientes() {
            localStorage.setItem('clientes', JSON.stringify(clientes));
        }

        function renderizarTabla(lista = clientes) {
            const tbody = document.getElementById('clientesTableBody');
            const noResults = document.getElementById('noResults');
            tbody.innerHTML = '';
            if (lista.length === 0) {
                noResults.style.display = 'block';
                return;
            }
            noResults.style.display = 'none';
            lista.forEach(c => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${c.idCliente}</td>
                    <td>${c.nombreCompleto}</td>
                    <td>${c.correo}</td>
                    <td>${c.telefono}</td>
                    <td>${c.numeroTarjeta}</td>
                    <td class="${c.estadoTarjeta === 'Activo' ? 'status-active' : 'status-inactive'}">${c.estadoTarjeta}</td>
                    <td>$${parseFloat(c.montoTarjeta).toFixed(2)}</td>
                    <td>${c.puntosAcumulados}</td>
                    <td><button class="delete-btn" onclick="eliminarCliente('${c.idCliente}')">Eliminar</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function eliminarCliente(id) {
            if (!confirm('¿Estás seguro de eliminar este cliente?')) return;
            const index = clientes.findIndex(c => c.idCliente === id);
            if (index !== -1) {
                clientes.splice(index, 1);
                guardarClientes();
                renderizarTabla();
            }
        }

        function filtrarClientes() {
            const id = document.getElementById('searchId').value.toLowerCase();
            const nombre = document.getElementById('searchNombre').value.toLowerCase();
            const filtrados = clientes.filter(c =>
                c.idCliente.toLowerCase().includes(id) &&
                c.nombreCompleto.toLowerCase().includes(nombre)
            );
            renderizarTabla(filtrados);
        }

        function limpiarFiltros() {
            document.getElementById('searchId').value = '';
            document.getElementById('searchNombre').value = '';
            renderizarTabla();
        }

        document.getElementById('clientForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const id = document.getElementById('idCliente').value.trim();
            if (clientes.some(c => c.idCliente === id)) {
                alert('El ID ya existe.');
                return;
            }
            const cliente = {
                idCliente: id,
                nombreCompleto: document.getElementById('nombreCompleto').value.trim(),
                correo: document.getElementById('correo').value.trim(),
                telefono: document.getElementById('telefono').value.trim(),
                numeroTarjeta: document.getElementById('numeroTarjeta').value.trim(),
                estadoTarjeta: document.getElementById('estadoTarjeta').value,
                montoTarjeta: document.getElementById('montoTarjeta').value,
                puntosAcumulados: document.getElementById('puntosAcumulados').value
            };
            clientes.push(cliente);
            guardarClientes();
            renderizarTabla();
            this.reset();
        });

        // Inicializar tabla
        renderizarTabla();
    </script>
</body>
</html>
