<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Costos y valorización – 20/80 Split</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f5f7fa;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 2rem; }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 1.5rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; }
    label { font-weight: 500; margin-bottom: .25rem; display: block; }
    input, select { width: 100%; padding: .6rem .75rem; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 1rem; }
    button { width: 100%; padding: .6rem; border: none; border-radius: 8px; font-weight: 500; cursor: pointer; background: var(--primary); color: #fff; }
    button:hover { background: var(--primary-hover); }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; margin-top: 1rem; }
    th, td { padding: .6rem .75rem; text-align: left; border-bottom: 1px solid var(--border); }
    th { background: var(--bg); font-weight: 600; }
    .tright { text-align: right; }
  </style>
</head>
<body>
  <h1>Costos y valorización</h1>

  <div class="grid">
    <!-- ENTRADA DE MERCANCÍA -->
    <div class="card">
      <h2>Registrar entrada</h2>
      <form id="frmEntrada">
        <label>Producto (SKU)</label>
        <select id="sku" required></select>

        <label>Cantidad entrante</label>
        <input id="cantEntra" type="number" min="1" required>

        <label>Costo unitario de la entrada ($)</label>
        <input id="costoEntra" type="number" step=".01" min=".01" required>

        <label>PVP actual ($)</label>
        <input id="pvp" type="number" step=".01" min=".01" required>

        <button type="submit">Actualizar stock y CPP</button>
      </form>
    </div>

    <!-- PARAMETROS -->
    <div class="card">
      <h2>Parámetros</h2>
      <label>Tipo de cambio del día (1 USD = ? MXN)</label>
      <input id="tipoCambio" type="number" step=".01" value="17.50">
      <button id="btnCierre">Descargar cierre contable (CSV)</button>
    </div>
  </div>

  <!-- TABLA RESUMEN -->
  <div class="card" style="margin-top:1.5rem">
    <h2>Valorización actual</h2>
    <table id="tblValor">
      <thead>
        <tr>
          <th>SKU</th>
          <th class="tright">Existencia</th>
          <th class="tright">CPP ($)</th>
          <th class="tright">PVP ($)</th>
          <th class="tright">Margen %</th>
          <th class="tright">Valorizado ($)</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    /* ----------  HELPERS  ---------- */
    const $ = s => document.querySelector(s);
    const key = 'inventario_costo';
    let db = JSON.parse(localStorage.getItem(key)) || {};   // { sku : {exist, cpp, pvp} }

    const save = () => localStorage.setItem(key, JSON.stringify(db));
    const fmt = n => n.toLocaleString('es-MX', {minimumFractionDigits:2, maximumFractionDigits:2});

    /* ----------  RELLENAR SELECT  ---------- */
    function fillSelect() {
      $('#sku').innerHTML = Object.keys(db).map(k => `<option value="${k}">${k}</option>`).join('');
      if (!Object.keys(db).length) $('#sku').innerHTML = '<option value="">Crea un producto primero</option>';
    }

    /* ----------  RENDER TABLA  ---------- */
    function render() {
      const tbody = $('#tblValor tbody');
      if (!Object.keys(db).length) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#6b7280">Sin productos</td></tr>'; return; }
      tbody.innerHTML = Object.entries(db).map(([sku, {exist, cpp, pvp}]) => {
        const margen = pvp > 0 ? ((pvp - cpp) / pvp * 100) : 0;
        const valorizado = exist * cpp;
        return `<tr>
          <td>${sku}</td>
          <td class="tright">${exist}</td>
          <td class="tright">$${fmt(cpp)}</td>
          <td class="tright">$${fmt(pvp)}</td>
          <td class="tright">${fmt(margen)} %</td>
          <td class="tright">$${fmt(valorizado)}</td>
        </tr>`;
      }).join('');
    }

    /* ----------  ALTA / ACTUALIZA COSTO  ---------- */
    $('#frmEntrada').addEventListener('submit', e => {
      e.preventDefault();
      const sku = $('#sku').value;
      if (!sku) return alert('Selecciona un SKU');
      const cantEntra = parseFloat($('#cantEntra').value);
      const costoEntra = parseFloat($('#costoEntra').value);
      const pvp = parseFloat($('#pvp').value);

      const old = db[sku] || { exist: 0, cpp: 0, pvp: 0 };
      const newExist = old.exist + cantEntra;
      const newCpp = ( (old.exist * old.cpp) + (cantEntra * costoEntra) ) / newExist;

      db[sku] = { exist: newExist, cpp: newCpp, pvp };
      save(); render(); e.target.reset();
    });

    /* ----------  DESCARGA CSV  ---------- */
    $('#btnCierre').addEventListener('click', () => {
      const tc = parseFloat($('#tipoCambio').value) || 1;
      const rows = [['SKU', 'EXISTENCIA', 'CPP_MXN', 'PVP_MXN', 'MARGEN_%', 'VALOR_MXN', 'VALOR_USD']];
      Object.entries(db).forEach(([sku, {exist, cpp, pvp}]) => {
        const margen = pvp > 0 ? ((pvp - cpp)/pvp*100) : 0;
        const valMx = exist * cpp;
        rows.push([sku, exist, fmt(cpp), fmt(pvp), fmt(margen), fmt(valMx), fmt(valMx/tc)]);
      });
      const csv = rows.map(r => r.join(',')).join('\n');
      const blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
      const link = document.createElement('a');
      const ts = new Date().toISOString().slice(0,10);
      link.href = URL.createObjectURL(blob);
      link.download = `cierre_inventario_${ts}.csv`;
      link.click();
    });

    /* ----------  INICIO  ---------- */
    /* Si no hay productos crea 3 de ejemplo */
    if (!Object.keys(db).length) {
      db = {
        PROD001: {exist: 10, cpp: 50, pvp: 80},
        PROD002: {exist: 25, cpp: 12.5, pvp: 20},
        PROD003: {exist:  5, cpp:100, pvp: 150}
      };
      save();
    }
    fillSelect(); render();
  </script>
</body>
</html>
