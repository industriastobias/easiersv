<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Gastos</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background-color: #f5f7fa;
      color: #333;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #007bff;
      color: #fff;
      padding: 1rem 2rem;
      text-align: center;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .container {
      max-width: 1200px;
      margin: 2rem auto;
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .input-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin-bottom: 1.2rem;
    }

    input, select, textarea, button {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    input:focus, textarea:focus, select:focus {
      border-color: #007bff;
      outline: none;
      box-shadow: 0 0 3px rgba(0, 123, 255, 0.3);
    }

    button {
      background-color: #007bff;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
    }

    th {
      background-color: #e9eef6;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 13px;
    }

    tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    tr:hover {
      background-color: #f1f6ff;
    }

    .acciones button {
      margin-right: 4px;
      padding: 5px 8px;
      font-size: 12px;
      border-radius: 4px;
    }

    .acciones .editar {
      background-color: #ffc107;
      color: #fff;
    }

    .acciones .eliminar {
      background-color: #dc3545;
      color: #fff;
    }

    .acciones .editar:hover { background-color: #e0a800; }
    .acciones .eliminar:hover { background-color: #c82333; }

  </style>
</head>
<body>
  <header>Registro de Gastos</header>

  <div class="container">
    <div class="input-row">
      <input type="date" id="fecha" />
      <input type="text" id="proveedor" placeholder="Proveedor" />
      <input type="text" id="categoria" placeholder="Categoría" />
      <input type="text" id="descripcion" placeholder="Descripción" />
      <input type="number" id="monto" placeholder="Monto $" step="0.01" />
      <input type="text" id="metodo" placeholder="Método de Pago" />
      <input type="text" id="comprobante" placeholder="N° de Comprobante" />
      <input type="text" id="responsable" placeholder="Responsable" />
      <input type="text" id="observaciones" placeholder="Observaciones" />
    </div>
    <button onclick="agregarGasto()">Agregar Gasto</button>

    <table id="tablaGastos">
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Proveedor</th>
          <th>Categoría</th>
          <th>Descripción</th>
          <th>Monto ($)</th>
          <th>Método</th>
          <th>Comprobante</th>
          <th>Responsable</th>
          <th>Observaciones</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    let gastos = JSON.parse(localStorage.getItem("gastos")) || [];

    function render() {
      const tbody = document.querySelector("#tablaGastos tbody");
      tbody.innerHTML = "";
      gastos.forEach((g, index) => {
        const fila = document.createElement("tr");
        fila.innerHTML = `
          <td>${g.fecha}</td>
          <td>${g.proveedor}</td>
          <td>${g.categoria}</td>
          <td>${g.descripcion}</td>
          <td>${g.monto.toFixed(2)}</td>
          <td>${g.metodo}</td>
          <td>${g.comprobante}</td>
          <td>${g.responsable}</td>
          <td>${g.observaciones}</td>
          <td class="acciones">
            <button class="editar" onclick="editarGasto(${index})">Editar</button>
            <button class="eliminar" onclick="eliminarGasto(${index})">Eliminar</button>
          </td>
        `;
        tbody.appendChild(fila);
      });
    }

    function agregarGasto() {
      const montoValor = parseFloat(document.getElementById("monto").value);
      if (isNaN(montoValor) || montoValor <= 0) {
        alert("Por favor ingresa un monto válido mayor a 0.");
        return;
      }

      const nuevoGasto = {
        fecha: document.getElementById("fecha").value,
        proveedor: document.getElementById("proveedor").value,
        categoria: document.getElementById("categoria").value,
        descripcion: document.getElementById("descripcion").value,
        monto: montoValor,
        metodo: document.getElementById("metodo").value,
        comprobante: document.getElementById("comprobante").value,
        responsable: document.getElementById("responsable").value,
        observaciones: document.getElementById("observaciones").value
      };

      gastos.push(nuevoGasto);
      localStorage.setItem("gastos", JSON.stringify(gastos));
      limpiarCampos();
      render();
    }

    function limpiarCampos() {
      document.querySelectorAll("input").forEach(i => i.value = "");
    }

    function eliminarGasto(i) {
      if (confirm("¿Seguro que deseas eliminar este gasto?")) {
        gastos.splice(i, 1);
        localStorage.setItem("gastos", JSON.stringify(gastos));
        render();
      }
    }

    function editarGasto(i) {
      const g = gastos[i];
      document.getElementById("fecha").value = g.fecha;
      document.getElementById("proveedor").value = g.proveedor;
      document.getElementById("categoria").value = g.categoria;
      document.getElementById("descripcion").value = g.descripcion;
      document.getElementById("monto").value = g.monto;
      document.getElementById("metodo").value = g.metodo;
      document.getElementById("comprobante").value = g.comprobante;
      document.getElementById("responsable").value = g.responsable;
      document.getElementById("observaciones").value = g.observaciones;
      eliminarGasto(i);
    }

    render();
  </script>
</body>
</html>
