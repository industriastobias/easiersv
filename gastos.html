<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gastos</title>

  <script>
    (function(){
      const tema = localStorage.getItem("tema");
      if (tema === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>

  <style>
    :root {
      --bg: #ffffff;
      --text: #222222;
      --line: #eeeeee;
    }

    [data-theme="dark"] {
      --bg: #000000;
      --text: #f5f5f5;
      --line: #222222;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      transition: background .3s, color .3s;
    }

    body {
      display: flex;
      flex-direction: column;
      padding: 2rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 500;
    }

    .toggle {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--text);
    }

    .input-row {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    input, select {
      flex: 1 1 180px;
      padding: 1rem 1.25rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border .2s;
    }

    input:focus, select:focus {
      border-color: var(--text);
    }

    .list {
      flex: 1;
      overflow-y: auto;
    }

    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 0;
      border-bottom: 1px solid var(--line);
      animation: fadeIn .3s ease;
      flex-wrap: wrap;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .item span {
      flex: 1 1 120px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .item button {
      background: none;
      border: none;
      color: var(--text);
      font-size: 1.2rem;
      cursor: pointer;
      opacity: .4;
      transition: opacity .2s;
    }

    .item button:hover {
      opacity: 1;
    }

    .total {
      position: sticky;
      bottom: 0;
      background: var(--bg);
      padding: 1rem 0;
      font-size: 1.25rem;
      font-weight: 500;
      text-align: right;
      border-top: 1px solid var(--line);
    }
  </style>
</head>
<body>

<header>
  <h1>Gastos</h1>
  <button class="toggle" onclick="toggleTheme()">○</button>
</header>

<div class="input-row">
  <input type="date" id="fecha" />
  <input type="text" id="proveedor" placeholder="Proveedor" />
  <select id="categoria">
    <option value="">Categoría</option>
    <option>Alimentos</option>
    <option>Transporte</option>
    <option>Servicios</option>
    <option>Oficina</option>
    <option>Otros</option>
  </select>
  <input type="text" id="descripcion" placeholder="Descripción" />
  <input type="number" id="monto" placeholder="Monto" step="0.01" />
  <input type="text" id="metodo" placeholder="Método de pago" />
  <input type="text" id="comprobante" placeholder="Comprobante (URL o nombre)" />
  <input type="text" id="responsable" placeholder="Responsable" />
  <input type="text" id="observaciones" placeholder="Observaciones" />
</div>

<div class="list" id="lista"></div>

<div class="total" id="total">Total: $0.00</div>

<script>
  let gastos = JSON.parse(localStorage.getItem("gastos")) || [];

  function toggleTheme() {
    const html = document.documentElement;
    const actual = html.getAttribute("data-theme");
    const nuevo = actual === "dark" ? "light" : "dark";
    html.setAttribute("data-theme", nuevo);
    localStorage.setItem("tema", nuevo);
  }

  function agregarGasto() {
    const gasto = {
      fecha: document.getElementById("fecha").value,
      proveedor: document.getElementById("proveedor").value.trim(),
      categoria: document.getElementById("categoria").value,
      descripcion: document.getElementById("descripcion").value.trim(),
      monto: parseFloat(document.getElementById("monto").value),
      metodo: document.getElementById("metodo").value.trim(),
      comprobante: document.getElementById("comprobante").value.trim(),
      responsable: document.getElementById("responsable").value.trim(),
      observaciones: document.getElementById("observaciones").value.trim()
    };

    if (!gasto.fecha || !gasto.proveedor || !gasto.categoria || !gasto.descripcion || isNaN(gasto.monto) || !gasto.metodo) {
      alert("Completa los campos obligatorios: Fecha, Proveedor, Categoría, Descripción, Monto y Método.");
      return;
    }

    gastos.push(gasto);
    guardarYRender();
    document.querySelectorAll(".input-row input, .input-row select").forEach(el => el.value = "");
  }

  function eliminarGasto(index) {
    if (confirm("¿Eliminar este gasto?")) {
      gastos.splice(index, 1);
      guardarYRender();
    }
  }

  function editarGasto(index, campo) {
    const valorActual = gastos[index][campo];
    const nuevoValor = prompt(`Editar ${campo}:`, valorActual);
    if (nuevoValor === null || nuevoValor.trim() === "") return;

    if (campo === "monto") {
      const num = parseFloat(nuevoValor);
      if (isNaN(num)) return;
      gastos[index][campo] = num;
    } else {
      gastos[index][campo] = nuevoValor.trim();
    }

    guardarYRender();
  }

  function guardarYRender() {
    localStorage.setItem("gastos", JSON.stringify(gastos));
    render();
  }

  function render() {
    const lista = document.getElementById("lista");
    lista.innerHTML = "";
    let total = 0;

    gastos.forEach((g, i) => {
      total += g.monto;
      const div = document.createElement("div");
      div.className = "item";
      div.innerHTML = `
        <span onclick="editarGasto(${i}, 'fecha')">${g.fecha}</span>
        <span onclick="editarGasto(${i}, 'proveedor')">${g.proveedor}</span>
        <span onclick="editarGasto(${i}, 'categoria')">${g.categoria}</span>
        <span onclick="editarGasto(${i}, 'descripcion')">${g.descripcion}</span>
        <span onclick="editarGasto(${i}, 'monto')">$${g.monto.toFixed(2)}</span>
        <span onclick="editarGasto(${i}, 'metodo')">${g.metodo}</span>
        <span onclick="editarGasto(${i}, 'comprobante')">${g.comprobante}</span>
        <span onclick="editarGasto(${i}, 'responsable')">${g.responsable}</span>
        <span onclick="editarGasto(${i}, 'observaciones')">${g.observaciones}</span>
        <button onclick="eliminarGasto(${i})">×</button>
      `;
      lista.appendChild(div);
    });

    document.getElementById("total").textContent = `Total: $${total.toFixed(2)}`;
  }

  document.addEventListener("keydown", e => {
    if (e.key === "Enter") agregarGasto();
  });

  render();
</script>

</body>
</html>
