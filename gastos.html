<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gastos</title>

  <style>
    :root {
      --bg: #f7f8fa;
      --text: #222;
      --primary: #007bff;
      --border: #ddd;
      --card: #fff;
      --shadow: rgba(0,0,0,0.05);
    }

    [data-theme="dark"] {
      --bg: #0e0e0e;
      --text: #f5f5f5;
      --border: #333;
      --card: #1b1b1b;
      --shadow: rgba(255,255,255,0.05);
    }

    * {
      box-sizing: border-box;
      font-family: "Inter", sans-serif;
      transition: background .3s, color .3s;
    }

    body {
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background: var(--card);
      box-shadow: 0 1px 4px var(--shadow);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 1.2rem;
      font-weight: 600;
    }

    nav {
      display: flex;
      gap: 1rem;
    }

    nav a {
      text-decoration: none;
      color: var(--text);
      font-weight: 500;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      transition: background .2s;
    }

    nav a:hover {
      background: var(--border);
    }

    main {
      flex: 1;
      padding: 2rem;
    }

    .input-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    input {
      padding: 0.8rem 1rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.9rem;
      background: var(--card);
      color: var(--text);
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 3px var(--shadow);
    }

    th, td {
      padding: 0.9rem 1rem;
      border-bottom: 1px solid var(--border);
      text-align: left;
      font-size: 0.9rem;
    }

    th {
      background: var(--bg);
      font-weight: 600;
    }

    tr:hover td {
      background: rgba(0,0,0,0.03);
      cursor: pointer;
    }

    button {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--primary);
      font-size: 1rem;
    }

    .total-box {
      position: fixed;
      bottom: 20px;
      right: 30px;
      background: var(--card);
      border: 1px solid var(--border);
      padding: 1rem 1.5rem;
      border-radius: 12px;
      box-shadow: 0 2px 8px var(--shadow);
      font-weight: 600;
      font-size: 1rem;
    }

    .add-btn {
      display: block;
      margin: 1rem auto 2rem;
      padding: 0.8rem 2rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 999px;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 2px 6px var(--shadow);
      transition: background .2s;
    }

    .add-btn:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>

  <header>
    <h1>Gestión de Gastos</h1>
    <nav>
      <a href="menu.html">Menú</a>
      <a href="almacenamiento.html">Almacenamiento</a>
      <a href="lista.html">Lista</a>
      <a href="compra.html">Compra</a>
    </nav>
  </header>

  <main>
    <div class="input-grid">
      <input type="date" id="fecha" placeholder="Fecha">
      <input type="text" id="proveedor" placeholder="Proveedor">
      <input type="text" id="categoria" placeholder="Categoría">
      <input type="text" id="descripcion" placeholder="Descripción">
      <input type="number" id="monto" placeholder="Monto" step="0.01">
      <input type="text" id="metodo" placeholder="Método de pago">
      <input type="text" id="comprobante" placeholder="Comprobante">
      <input type="text" id="responsable" placeholder="Responsable">
      <input type="text" id="observaciones" placeholder="Observaciones">
    </div>

    <button class="add-btn" onclick="agregarGasto()">Agregar gasto</button>

    <table id="tablaGastos">
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Proveedor</th>
          <th>Categoría</th>
          <th>Descripción</th>
          <th>Monto</th>
          <th>Método</th>
          <th>Comprobante</th>
          <th>Responsable</th>
          <th>Observaciones</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>

  <div class="total-box" id="totalBox">Total: $0.00</div>

  <script>
    let gastos = JSON.parse(localStorage.getItem("gastos")) || [];

    function agregarGasto() {
      const gasto = {
        fecha: document.getElementById("fecha").value,
        proveedor: document.getElementById("proveedor").value,
        categoria: document.getElementById("categoria").value,
        descripcion: document.getElementById("descripcion").value,
        monto: parseFloat(document.getElementById("monto").value) || 0,
        metodo: document.getElementById("metodo").value,
        comprobante: document.getElementById("comprobante").value,
        responsable: document.getElementById("responsable").value,
        observaciones: document.getElementById("observaciones").value
      };

      gastos.push(gasto);
      guardarYRender();
      document.querySelectorAll("input").forEach(i => i.value = "");
    }

    function editarGasto(index, campo) {
      const nuevoValor = prompt(`Editar ${campo}:`, gastos[index][campo]);
      if (nuevoValor !== null) {
        if (campo === "monto") {
          const num = parseFloat(nuevoValor);
          if (!isNaN(num)) gastos[index][campo] = num;
        } else {
          gastos[index][campo] = nuevoValor;
        }
        guardarYRender();
      }
    }

    function eliminarGasto(index) {
      if (confirm("¿Eliminar este gasto?")) {
        gastos.splice(index, 1);
        guardarYRender();
      }
    }

    function guardarYRender() {
      localStorage.setItem("gastos", JSON.stringify(gastos));
      render();
    }

    function render() {
      const tbody = document.querySelector("#tablaGastos tbody");
      tbody.innerHTML = "";
      let total = 0;

      gastos.forEach((g, i) => {
        total += g.monto || 0;
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td onclick="editarGasto(${i}, 'fecha')">${g.fecha || ""}</td>
          <td onclick="editarGasto(${i}, 'proveedor')">${g.proveedor || ""}</td>
          <td onclick="editarGasto(${i}, 'categoria')">${g.categoria || ""}</td>
          <td onclick="editarGasto(${i}, 'descripcion')">${g.descripcion || ""}</td>
          <td onclick="editarGasto(${i}, 'monto')">$${(g.monto || 0).toFixed(2)}</td>
          <td onclick="editarGasto(${i}, 'metodo')">${g.metodo || ""}</td>
          <td onclick="editarGasto(${i}, 'comprobante')">${g.comprobante || ""}</td>
          <td onclick="editarGasto(${i}, 'responsable')">${g.responsable || ""}</td>
          <td onclick="editarGasto(${i}, 'observaciones')">${g.observaciones || ""}</td>
          <td><button onclick="eliminarGasto(${i})">🗑️</button></td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById("totalBox").textContent = `Total: $${total.toFixed(2)}`;
      localStorage.setItem("totalGastos", total.toFixed(2)); // sincroniza con lista.html
    }

    render();
  </script>
</body>
</html>
