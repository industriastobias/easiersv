<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Gastos</title>
  <style>
    :root {
      --primary: #2563eb;
      --secondary: #f3f4f6;
      --text: #111827;
      --white: #fff;
      --border: #e5e7eb;
      --hover: #e0e7ff;
    }

    body {
      font-family: "Inter", sans-serif;
      background-color: #f9fafb;
      margin: 0;
      color: var(--text);
    }

    header {
      background-color: var(--white);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 1.5rem;
      color: var(--primary);
      margin: 0;
      font-weight: 700;
    }

    .container {
      max-width: 1100px;
      margin: 2rem auto;
      background-color: var(--white);
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      padding: 2rem;
    }

    .input-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 1rem;
    }

    input, select, textarea {
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      background-color: var(--secondary);
      transition: all 0.2s ease;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      background-color: var(--white);
      outline: none;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
    }

    button {
      background-color: var(--primary);
      color: var(--white);
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      border-bottom: 1px solid var(--border);
      text-align: left;
      padding: 10px;
      font-size: 14px;
    }

    th {
      background-color: var(--secondary);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 13px;
      color: #374151;
    }

    tr:hover {
      background-color: var(--hover);
    }

    .acciones button {
      margin-right: 5px;
      padding: 5px 8px;
      font-size: 12px;
      border-radius: 6px;
    }

    .editar {
      background-color: #f59e0b;
      color: white;
    }

    .eliminar {
      background-color: #ef4444;
      color: white;
    }

    .editar:hover { background-color: #d97706; }
    .eliminar:hover { background-color: #dc2626; }

  </style>
</head>
<body>
  <header>
    <h1>Gestión de Gastos</h1>
    <button onclick="limpiarCampos()">Nuevo Registro</button>
  </header>

  <div class="container">
    <div class="input-grid">
      <input type="date" id="fecha" />
      <input type="text" id="proveedor" placeholder="Proveedor" />
      <input type="text" id="categoria" placeholder="Categoría" />
      <input type="text" id="descripcion" placeholder="Descripción" />
      <input type="number" id="monto" placeholder="Monto $" step="0.01" />
      <input type="text" id="metodo" placeholder="Método de Pago" />
      <input type="text" id="comprobante" placeholder="N° Comprobante" />
      <input type="text" id="responsable" placeholder="Responsable" />
      <input type="text" id="observaciones" placeholder="Observaciones" />
    </div>

    <button onclick="agregarGasto()">Guardar Gasto</button>

    <table id="tablaGastos">
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Proveedor</th>
          <th>Categoría</th>
          <th>Descripción</th>
          <th>Monto ($)</th>
          <th>Método</th>
          <th>Comprobante</th>
          <th>Responsable</th>
          <th>Observaciones</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    let gastos = JSON.parse(localStorage.getItem("gastos")) || [];

    function render() {
      const tbody = document.querySelector("#tablaGastos tbody");
      tbody.innerHTML = "";
      gastos.forEach((g, index) => {
        const fila = document.createElement("tr");
        fila.innerHTML = `
          <td>${g.fecha || ""}</td>
          <td>${g.proveedor || ""}</td>
          <td>${g.categoria || ""}</td>
          <td>${g.descripcion || ""}</td>
          <td>${g.monto ? g.monto.toFixed(2) : ""}</td>
          <td>${g.metodo || ""}</td>
          <td>${g.comprobante || ""}</td>
          <td>${g.responsable || ""}</td>
          <td>${g.observaciones || ""}</td>
          <td class="acciones">
            <button class="editar" onclick="editarGasto(${index})">Editar</button>
            <button class="eliminar" onclick="eliminarGasto(${index})">Eliminar</button>
          </td>
        `;
        tbody.appendChild(fila);
      });
    }

    function agregarGasto() {
      const nuevoGasto = {
        fecha: document.getElementById("fecha").value,
        proveedor: document.getElementById("proveedor").value,
        categoria: document.getElementById("categoria").value,
        descripcion: document.getElementById("descripcion").value,
        monto: parseFloat(document.getElementById("monto").value) || 0,
        metodo: document.getElementById("metodo").value,
        comprobante: document.getElementById("comprobante").value,
        responsable: document.getElementById("responsable").value,
        observaciones: document.getElementById("observaciones").value
      };

      gastos.push(nuevoGasto);
      localStorage.setItem("gastos", JSON.stringify(gastos));
      limpiarCampos();
      render();
    }

    function limpiarCampos() {
      document.querySelectorAll("input").forEach(i => i.value = "");
      document.getElementById("fecha").focus();
    }

    function eliminarGasto(i) {
      if (confirm("¿Seguro que deseas eliminar este gasto?")) {
        gastos.splice(i, 1);
        localStorage.setItem("gastos", JSON.stringify(gastos));
        render();
      }
    }

    function editarGasto(i) {
      const g = gastos[i];
      document.getElementById("fecha").value = g.fecha;
      document.getElementById("proveedor").value = g.proveedor;
      document.getElementById("categoria").value = g.categoria;
      document.getElementById("descripcion").value = g.descripcion;
      document.getElementById("monto").value = g.monto;
      document.getElementById("metodo").value = g.metodo;
      document.getElementById("comprobante").value = g.comprobante;
      document.getElementById("responsable").value = g.responsable;
      document.getElementById("observaciones").value = g.observaciones;
      eliminarGasto(i);
    }

    render();
  </script>
</body>
</html>
