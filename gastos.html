<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Gastos</title>
  <style>
    :root {
      --primary: #2563eb;
      --secondary: #f1f5f9;
      --text: #1e293b;
      --accent: #3b82f6;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #10b981;
    }

    body {
      font-family: "Inter", "Segoe UI", sans-serif;
      background-color: #f8fafc;
      color: var(--text);
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background-color: var(--primary);
      color: white;
      padding: 1rem 2rem;
      font-size: 1.4rem;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-size: 0.95rem;
      padding: 6px 10px;
      border-radius: 6px;
      transition: background 0.3s;
    }

    header nav a:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }

    .container {
      flex: 1;
      max-width: 1200px;
      margin: 2rem auto;
      background: white;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
    }

    h2 {
      color: var(--primary);
      border-bottom: 2px solid var(--secondary);
      padding-bottom: 0.5rem;
      font-weight: 600;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 1rem;
    }

    input, select, textarea {
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.95rem;
      background-color: #f9fafb;
      transition: all 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      background-color: #fff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    button {
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
      padding: 10px 18px;
      margin-right: 10px;
    }

    .btn-primary:hover {
      background-color: #1d4ed8;
    }

    .btn-success {
      background-color: var(--success);
      color: white;
      padding: 10px 18px;
      display: none;
    }

    .btn-success:hover {
      background-color: #059669;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }

    th, td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
    }

    th {
      background-color: var(--secondary);
      text-transform: uppercase;
      font-size: 0.8rem;
      color: #475569;
      letter-spacing: 0.5px;
    }

    tr:hover {
      background-color: #f8fafc;
    }

    .acciones {
      display: flex;
      gap: 6px;
    }

    .acciones button {
      padding: 6px 10px;
      font-size: 0.8rem;
      border-radius: 6px;
    }

    .editar {
      background-color: var(--warning);
      color: white;
    }

    .eliminar {
      background-color: var(--danger);
      color: white;
    }

    .editar:hover { background-color: #d97706; }
    .eliminar:hover { background-color: #b91c1c; }

    @media (max-width: 768px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <header>
    <div>💼 Panel de Gastos</div>
    <nav>
      <a href="menu.html">Menú</a>
      <a href="almacenamiento.html">Almacenamiento</a>
      <a href="lista.html">Lista</a>
      <a href="compra.html">Compras</a>
    </nav>
  </header>

  <div class="container">
    <h2>Registro de Gastos</h2>

    <div class="form-grid">
      <input type="date" id="fecha" placeholder="Fecha" />
      <input type="text" id="proveedor" placeholder="Proveedor" />
      <input type="text" id="categoria" placeholder="Categoría" />
      <input type="text" id="descripcion" placeholder="Descripción" />
      <input type="number" id="monto" placeholder="Monto ($)" step="0.01" />
      <input type="text" id="metodo" placeholder="Método de Pago" />
      <input type="text" id="comprobante" placeholder="N° de Comprobante" />
      <input type="text" id="responsable" placeholder="Responsable" />
      <input type="text" id="observaciones" placeholder="Observaciones" />
    </div>

    <div>
      <button class="btn-primary" id="btnGuardar" onclick="agregarGasto()">💾 Guardar Gasto</button>
      <button class="btn-success" id="btnActualizar" onclick="guardarEdicion()">✅ Guardar Cambios</button>
    </div>

    <table id="tablaGastos">
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Proveedor</th>
          <th>Categoría</th>
          <th>Descripción</th>
          <th>Monto</th>
          <th>Método</th>
          <th>Comprobante</th>
          <th>Responsable</th>
          <th>Observaciones</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    let gastos = JSON.parse(localStorage.getItem("gastos")) || [];
    let indiceEdicion = null;

    function render() {
      const tbody = document.querySelector("#tablaGastos tbody");
      tbody.innerHTML = "";
      gastos.forEach((g, index) => {
        const fila = document.createElement("tr");
        fila.innerHTML = `
          <td>${g.fecha || ""}</td>
          <td>${g.proveedor || ""}</td>
          <td>${g.categoria || ""}</td>
          <td>${g.descripcion || ""}</td>
          <td>${g.monto ? g.monto.toFixed(2) : ""}</td>
          <td>${g.metodo || ""}</td>
          <td>${g.comprobante || ""}</td>
          <td>${g.responsable || ""}</td>
          <td>${g.observaciones || ""}</td>
          <td class="acciones">
            <button class="editar" onclick="editarGasto(${index})">Editar</button>
            <button class="eliminar" onclick="eliminarGasto(${index})">Eliminar</button>
          </td>
        `;
        tbody.appendChild(fila);
      });
    }

    function agregarGasto() {
      const nuevoGasto = obtenerDatosFormulario();
      gastos.push(nuevoGasto);
      guardarLocal();
      limpiarCampos();
      render();
    }

    function editarGasto(i) {
      const g = gastos[i];
      indiceEdicion = i;
      for (let campo in g) {
        if (document.getElementById(campo)) {
          document.getElementById(campo).value = g[campo];
        }
      }
      document.getElementById("btnGuardar").style.display = "none";
      document.getElementById("btnActualizar").style.display = "inline-block";
    }

    function guardarEdicion() {
      if (indiceEdicion === null) return;
      gastos[indiceEdicion] = obtenerDatosFormulario();
      guardarLocal();
      limpiarCampos();
      render();
      indiceEdicion = null;
      document.getElementById("btnGuardar").style.display = "inline-block";
      document.getElementById("btnActualizar").style.display = "none";
    }

    function eliminarGasto(i) {
      if (confirm("¿Seguro que deseas eliminar este gasto?")) {
        gastos.splice(i, 1);
        guardarLocal();
        render();
      }
    }

    function obtenerDatosFormulario() {
      return {
        fecha: document.getElementById("fecha").value,
        proveedor: document.getElementById("proveedor").value,
        categoria: document.getElementById("categoria").value,
        descripcion: document.getElementById("descripcion").value,
        monto: parseFloat(document.getElementById("monto").value) || 0,
        metodo: document.getElementById("metodo").value,
        comprobante: document.getElementById("comprobante").value,
        responsable: document.getElementById("responsable").value,
        observaciones: document.getElementById("observaciones").value
      };
    }

    function limpiarCampos() {
      document.querySelectorAll("input, textarea").forEach(i => i.value = "");
    }

    function guardarLocal() {
      localStorage.setItem("gastos", JSON.stringify(gastos));
    }

    render();
  </script>
</body>
</html>
