<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Inventario</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap');
        :root {
            --bg: #f5f7fa;
            --text: #1f2937;
            --border: #d1d5db;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --highlight: #f3f4f6;
            --white: #ffffff;
            --danger: #dc2626;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier Prime', monospace; }

        html, body { height: 100%; width: 100%; background: var(--bg); color: var(--text); }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            text-align: center;
            margin: .6rem 0 .4rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* ======  CONTENEDOR 90 %  ====== */
        .container {
            width: 90vw;
            height: 90vh;
            background: var(--white);
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .search-block {
            display: flex;
            flex-wrap: wrap;
            gap: .6rem;
            margin-bottom: .8rem;
            align-items: flex-end;
        }
        label { font-weight: 700; font-size: .8rem; }
        input, select {
            padding: .4rem .5rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: .85rem;
        }
        button.stamp {
            padding: .4rem .8rem;
            border: 1px solid var(--accent);
            background: var(--accent);
            color: var(--white);
            font-weight: 700;
            font-size: .75rem;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            transition: background .2s ease;
        }
        button.stamp:hover { background: var(--accent-hover); }

        table { width: 100%; border-collapse: collapse; margin-top: .5rem; }
        thead { background: var(--highlight); }
        th, td { padding: .4rem .5rem; border: 1px solid var(--border); text-align: left; font-size: .8rem; }
        th { font-weight: 700; letter-spacing: .5px; }
        tbody tr:nth-child(odd) { background: var(--highlight); }
        td img { max-height: 40px; border-radius: 4px; object-fit: cover; }

        .no-results, .result-message, .confirmation-message {
            font-weight: 700; text-align: center; margin-top: .5rem; font-size: .8rem;
        }
        .no-results { color: var(--danger); }
        .result-message { color: var(--text); }
        .confirmation-message { color: var(--accent); }

        .modal {
            display: none; position: fixed; z-index: 10; left: 0; top: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,.4);
        }
        .modal-content {
            background: var(--white); border: 1px solid var(--border);
            margin: 10% auto; padding: 1.5rem; width: 90%; max-width: 400px;
            border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.1); position: relative;
        }
        .close { position: absolute; top: .4rem; right: .6rem; font-size: 1.4rem; cursor: pointer; }
        .highlight { background: var(--accent) !important; color: var(--white); font-weight: 700; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }
    </style>
</head>

<body>
    <h1>Gestión de Inventario</h1>

    <!-- 90 % de la pantalla -->
    <div class="container">
        <div class="search-block">
            <div>
                <label for="searchCategory">Filtrar por categoría:</label>
                <select id="searchCategory">
                    <option value="">Todas las categorías</option>
                    <option value="Aritos">Aritos</option>
                    <option value="Billeteras">Billeteras</option>
                    <option value="Carteras">Carteras</option>
                    <option value="Chokers">Chokers</option>
                    <option value="Collares">Collares</option>
                    <option value="Lentes de sol">Lentes de sol</option>
                    <option value="Pulseras">Pulseras</option>
                    <option value="Relojes">Relojes</option>
                    <option value="Anillos">Anillos</option>
                    <option value="Accesorios para el cabello">Accesorios para el cabello</option>
                    <option value="Otros">Otros</option>
                </select>
            </div>
            <div>
                <label for="searchCode">Buscar por código:</label>
                <input type="text" id="searchCode">
            </div>
            <button class="stamp" onclick="openSoldModal()">Registrar Venta</button>
        </div>

        <div style="display:flex; gap:.5rem; align-items:center; flex-wrap: wrap;">
            <label for="goToRow">Ir a fila:</label>
            <input type="number" id="goToRow" min="1" style="width:70px;">
            <button class="stamp" onclick="goToRow()">Ir</button>
            <button class="stamp" onclick="clearFilters()" style="margin-left:auto;">Limpiar filtros</button>
        </div>

        <div style="flex:1 1 auto; overflow:auto; margin-top:.4rem;">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Imagen</th>
                        <th>Nombre</th>
                        <th>Código</th>
                        <th>Código de Barras</th>
                        <th>Precio</th>
                        <th>Desc(%)</th>
                        <th>Precio c/Desc</th>
                        <th>Descripción</th>
                        <th>Categoría</th>
                        <th>Stock</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="inventoryList"></tbody>
            </table>
            <div id="noResultsMessage" class="no-results" style="display:none;">No se encontraron productos.</div>
            <div id="resultMessage" class="result-message" style="display:none;"></div>
        </div>
    </div>

    <!-- Modal registrar venta -->
    <div id="soldModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeSoldModal()">&times;</span>
            <h2>Registrar Venta</h2>
            <label for="soldQuantity">Cantidad vendida:</label>
            <input type="number" id="soldQuantity" min="1">
            <label for="soldPrice" style="margin-top:1rem;display:block;">Precio vendido (unidad):</label>
            <input type="number" id="soldPrice" min="0" step="0.01" placeholder="Ej: 1500">
            <button class="stamp" onclick="processSale()">Registrar</button>
            <div id="confirmationMessage" class="confirmation-message" style="display:none;">¡Venta registrada!</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.4/xlsx.full.min.js"></script>
    <script>
        let inventory = JSON.parse(localStorage.getItem('inventory')) || [];
        let currentSoldIndex = -1;

        function loadInventory(filteredInventory = inventory) {
            const list = document.getElementById('inventoryList');
            const noResults = document.getElementById('noResultsMessage');
            const resultMsg = document.getElementById('resultMessage');

            if (filteredInventory.length === 0) {
                list.innerHTML = '';
                noResults.style.display = 'block';
                resultMsg.style.display = 'none';
            } else {
                noResults.style.display = 'none';
                list.innerHTML = filteredInventory.map((item, index) => {
                    const priceWithDiscount = (item.price * (1 - item.discount / 100)).toFixed(2);
                    return `
                        <tr id="product-${index}">
                            <td>${index + 1}</td>
                            <td>${item.imageData ? `<img src="${item.imageData}" alt="${item.name}">` : '—'}</td>
                            <td>${item.name}</td>
                            <td>${item.code}</td>
                            <td>${item.barcode}</td>
                            <td>${item.price}</td>
                            <td>${item.discount}</td>
                            <td>${priceWithDiscount}</td>
                            <td>${item.description}</td>
                            <td>${item.category}</td>
                            <td>${item.quantity}</td>
                            <td><button class="stamp" onclick="markSold(${index})">Vender</button></td>
                        </tr>
                    `;
                }).join('');
            }
        }

        function markSold(index) {
            currentSoldIndex = index;
            document.getElementById('soldModal').style.display = 'block';
        }
        function openSoldModal() {
            document.getElementById('soldModal').style.display = 'block';
        }
        function closeSoldModal() {
            document.getElementById('soldModal').style.display = 'none';
            document.getElementById('confirmationMessage').style.display = 'none';
        }

        function processSale() {
            const soldQty = parseInt(document.getElementById('soldQuantity').value);
            const soldPrice = parseFloat(document.getElementById('soldPrice').value);

            if (isNaN(soldQty) || soldQty <= 0) { alert('Cantidad inválida'); return; }
            if (isNaN(soldPrice) || soldPrice < 0) { alert('Precio inválido'); return; }

            const item = inventory[currentSoldIndex];
            if (soldQty > item.quantity) { alert('Stock insuficiente'); return; }

            item.quantity -= soldQty;
            localStorage.setItem('inventory', JSON.stringify(inventory));

            const soldItem = {
                name: item.name, code: item.code, price: soldPrice,
                quantity: soldQty, total: soldPrice * soldQty
            };
            let soldInventory = JSON.parse(localStorage.getItem('soldInventory') || '[]');
            soldInventory.push(soldItem);
            localStorage.setItem('soldInventory', JSON.stringify(soldInventory));

            filterInventory();
            closeSoldModal();
            document.getElementById('resultMessage').textContent = '¡Venta registrada!';
            document.getElementById('resultMessage').style.display = 'block';
            setTimeout(() => document.getElementById('resultMessage').style.display = 'none', 3000);

            document.getElementById('soldQuantity').value = '';
            document.getElementById('soldPrice').value = '';
        }

        function filterInventory() {
            const category = document.getElementById('searchCategory').value.trim().toLowerCase();
            const code = document.getElementById('searchCode').value.trim().toLowerCase();
            const filtered = inventory.filter(item => {
                const catOk = !category || item.category.trim().toLowerCase() === category;
                const codOk = !code || item.code.trim().toLowerCase().includes(code);
                return catOk && codOk && item.quantity > 0;
            });
            loadInventory(filtered);
        }

        function goToRow() {
            const row = parseInt(document.getElementById('goToRow').value);
            const rows = document.querySelectorAll('#inventoryList tr');
            rows.forEach(r => r.classList.remove('highlight'));
            if (row >= 1 && row <= rows.length) {
                rows[row - 1].scrollIntoView({ behavior: 'smooth', block: 'center' });
                rows[row - 1].classList.add('highlight');
            } else alert('Fila fuera de rango.');
        }

        function clearFilters() {
            document.getElementById('searchCategory').value = '';
            document.getElementById('searchCode').value = '';
            document.getElementById('goToRow').value = '';
            loadInventory();
            document.getElementById('resultMessage').style.display = 'none';
        }

        document.getElementById('searchCategory').addEventListener('change', debounce(filterInventory, 300));
        document.getElementById('searchCode').addEventListener('input', debounce(filterInventory, 300));

        loadInventory();

        function debounce(fn, d) {
            let t;
            return function (...args) {
                clearTimeout(t);
                t = setTimeout(() => fn.apply(this, args), d);
            };
        }
    </script>
</body>
</html>
