<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almacenamiento</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap');

        :root {
            --bg: #f5f7fa;
            --text: #1f2937;
            --border: #d1d5db;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --highlight: #f3f4f6;
            --white: #ffffff;
            --danger: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier Prime', monospace;
        }

        body {
            background: var(--bg);
            color: var(--text);
            padding: 2rem;
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 2rem;
            text-transform: uppercase;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            background: var(--white);
            border: 1px solid var(--border);
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th, td {
            padding: .6rem .8rem;
            border: 1px solid var(--border);
            text-align: left;
        }

        th {
            background: var(--highlight);
            font-weight: 700;
        }

        .no-results {
            font-weight: 700;
            text-align: center;
            margin-top: 1rem;
            color: var(--danger);
        }

        .highlight {
            background: var(--accent) !important;
            color: var(--white);
            font-weight: 700;
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <h1>Almacenamiento</h1>

    <div class="container">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Nombre</th>
                    <th>Código</th>
                    <th>Código de Barras</th>
                    <th>Precio</th>
                    <th>Descuento (%)</th>
                    <th>Precio con Descuento</th>
                    <th>Descripción</th>
                    <th>Categoría</th>
                    <th>Cantidad en Stock</th>
                </tr>
            </thead>
            <tbody id="almacenList"></tbody>
        </table>

        <div id="noResultsMessage" class="no-results" style="display:none;">No hay productos en almacén.</div>
    </div>

    <script>
        // ✅ Usamos la misma clave que compra.html: 'inventory'
        let almacen = JSON.parse(localStorage.getItem('inventory')) || [];

        function loadAlmacen() {
            const list = document.getElementById('almacenList');
            const noResults = document.getElementById('noResultsMessage');

            if (almacen.length === 0) {
                list.innerHTML = '';
                noResults.style.display = 'block';
            } else {
                noResults.style.display = 'none';
                list.innerHTML = almacen.map((item, index) => {
                    const priceWithDiscount = (item.price * (1 - item.discount / 100)).toFixed(2);
                    return `
                        <tr id="product-${index}">
                            <td>${index + 1}</td>
                            <td>${item.name}</td>
                            <td>${item.code}</td>
                            <td>${item.barcode}</td>
                            <td>${item.price}</td>
                            <td>${item.discount}</td>
                            <td>${priceWithDiscount}</td>
                            <td>${item.description}</td>
                            <td>${item.category}</td>
                            <td>${item.quantity}</td>
                        </tr>
                    `;
                }).join('');
            }
        }

        // Cargar al iniciar
        loadAlmacen();

        // Escuchar cambios en localStorage (por si compras desde otra pestaña)
        window.addEventListener('storage', loadAlmacen);
    </script>
</body>
</html>
