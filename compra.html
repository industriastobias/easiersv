<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Gestión de Compras - 6.000 productos</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* ---------- tus mismos estilos ---------- */
:root{--bg:#f8f9fa;--card:#fff;--lavanda:#243b55;--menta:#4a6572;--coral:#6c757d;--text:#212529;--muted:#6c757d;--shadow:0 8px 24px rgba(33,37,41,.1)}
*{box-sizing:border-box;margin:0;padding:0;font-family:Poppins,system-ui,sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem}
h1{font-size:2.2rem;font-weight:600;margin-bottom:2rem;letter-spacing:-.5px;color:var(--lavanda)}
.container{width:100%;max-width:1200px;display:flex;flex-direction:column;gap:2rem}
.bubble{background:var(--card);border-radius:24px;padding:2rem;box-shadow:var(--shadow);transition:transform .3s ease}
.bubble:hover{transform:translateY(-4px)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1.2rem}
label{font-size:.9rem;color:var(--muted);margin-bottom:.25rem}
input,select,textarea{width:100%;padding:.75rem 1rem;border:1px solid transparent;border-radius:16px;background:#e9ecef;color:var(--text);transition:background .3s,border-color .3s}
input:focus,select:focus,textarea:focus{outline:none;background:#fff;border-color:var(--lavanda)}
button{padding:.75rem 1.5rem;border:none;border-radius:16px;font-weight:600;cursor:pointer;transition:all .3s ease}
button.lavanda{background:var(--lavanda);color:#fff;box-shadow:0 4px 14px rgba(36,59,85,.4)}
button.lavanda:hover{transform:scale(1.05)}
button.menta{background:var(--menta);color:#fff;box-shadow:0 4px 14px rgba(74,101,114,.4)}
button.menta:hover{transform:scale(1.05)}
button.coral{background:var(--coral);color:#fff;box-shadow:0 4px 14px rgba(108,117,125,.4)}
button.coral:hover{transform:scale(1.05)}
.table-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.5rem}
.card-item{background:var(--card);border-radius:20px;padding:1.5rem;display:flex;flex-direction:column;gap:.5rem;box-shadow:var(--shadow);transition:transform .3s,box-shadow .3s}
.card-item:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(33,37,41,.15)}
.card-item img{width:100%;height:160px;object-fit:cover;border-radius:16px;margin-bottom:.5rem}
.card-item h3{font-size:1.1rem;color:var(--lavanda)}
.card-item p{font-size:.9rem;color:var(--muted)}
.card-item .actions{margin-top:auto;display:flex;gap:.5rem}
.total-box{align-self:center;padding:1.5rem 3rem;background:var(--card);border-radius:20px;box-shadow:var(--shadow);text-align:center}
.total-box h2{font-size:1rem;color:var(--lavanda);margin:0}
.total-box p{font-size:2rem;font-weight:700;margin:0;color:var(--menta)}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:var(--lavanda);border-radius:4px}
</style>
</head>
<body>

<h1>Gestión de Compras</h1>

<div class="container">
  <div class="bubble">
    <form id="purchaseForm" class="form-grid">
      <div><label>Nombre del Producto:</label><input type="text" id="name" name="name" required></div>
      <div><label>Código:</label><input type="text" id="code" name="code" required></div>
      <div><label>Código de Barras:</label><input type="text" id="barcode" name="barcode"></div>
      <div><label>Precio:</label><input type="number" id="price" name="price" step="0.01" required></div>
      <div><label>Descuento (%):</label><input type="number" id="discount" name="discount" step="0.01" value="0"></div>
      <div><label>Cantidad en Stock:</label><input type="number" id="quantity" name="quantity" required></div>
      <div style="grid-column:1/-1"><label>Descripción:</label><textarea id="description" name="description" rows="2"></textarea></div>
      <div><label>Categoría:</label>
        <select id="category" name="category">
          <option>Aritos</option><option>Billeteras</option><option>Carteras</option><option>Chokers</option>
          <option>Collares</option><option>Lentes de sol</option><option>Pulseras</option><option>Relojes</option>
          <option>Anillos</option><option>Accesorios para el cabello</option><option>Otros</option>
        </select>
      </div>
      <div style="grid-column:1/-1">
        <label>Imagen del producto:</label>
        <input type="file" id="imageFile" accept="image/*" onchange="previewImage(event)">
        <div style="margin-top:.5rem"><img id="imagePreview" src="" alt="Vista previa" style="max-height:160px;border-radius:16px;display:none"></div>
        <input type="hidden" id="imageData" name="imageData">
      </div>
      <div style="grid-column:1/-1;display:flex;gap:1rem;flex-wrap:wrap">
        <button type="submit" class="lavanda">Guardar</button>
        <input type="file" id="importFile" accept=".xlsx,.xls" style="display:none" onchange="importFromExcel(event)">
        <button type="button" class="menta" onclick="document.getElementById('importFile').click()">Importar Excel</button>
        <button type="button" class="menta" onclick="exportToExcel()">Exportar Excel</button>
        <button type="button" class="coral" onclick="exportToPDF()">Exportar PDF con Imágenes</button>
        <button type="button" class="coral" onclick="vaciarInventario()">Vaciar Inventario</button>
      </div>
    </form>
  </div>

  <div class="table-cards" id="inventoryList"></div>
</div>

<div class="total-box">
  <h2>Total en USD</h2>
  <p id="totalAmount">$0.00</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.4/xlsx.full.min.js"></script>
<script>
/* ---------- variables ---------- */
let inventory = [];
let editIndex = -1;
let db;

/* ---------- abrir / crear BD ---------- */
const req = indexedDB.open('InventarioDB',1);
req.onerror=()=>console.error('Error al abrir IndexedDB');
req.onsuccess=()=>{db=req.result; loadAll();};
req.onupgradeneeded=()=>{
  db=req.result;
  if(!db.objectStoreNames.contains('productos'))
    db.createObjectStore('productos',{keyPath:'id',autoIncrement:true});
};

/* ---------- CRUD básico ---------- */
function addItem(item,ok){               // CREATE
  const tx=db.transaction('productos','readwrite');
  tx.objectStore('productos').add(item);
  tx.oncomplete=()=>ok();
}
function putItem(item,ok){               // UPDATE
  const tx=db.transaction('productos','readwrite');
  tx.objectStore('productos').put(item);
  tx.oncomplete=()=>ok();
}
function delItem(id,ok){                 // DELETE
  const tx=db.transaction('productos','readwrite');
  tx.objectStore('productos').delete(id);
  tx.oncomplete=()=>ok();
}
function clearAll(ok){                   // CLEAR
  const tx=db.transaction('productos','readwrite');
  tx.objectStore('productos').clear();
  tx.oncomplete=()=>ok();
}
function loadAll(){                      // READ
  const tx=db.transaction('productos','readonly');
  const req=tx.objectStore('productos').getAll();
  req.onsuccess=()=>{inventory=req.result; renderTable(); calculateTotal();};
}

/* ---------- cálculo del total ---------- */
function calculateTotal(){
  const t=inventory.reduce((s,it)=>s+((+it.price||0)*(+it.quantity||0)),0);
  document.getElementById('totalAmount').textContent=`$${t.toFixed(2)}`;
}

/* ---------- pintar tarjetas ---------- */
function renderTable(){
  const list=document.getElementById('inventoryList');
  list.innerHTML=inventory.map((it,idx)=>`
    <div class="card-item">
      ${it.imageData?`<img src="${it.imageData}" alt="">`:''}
      <h3>${it.name}</h3>
      <p><strong>Código:</strong>${it.code}</p>
      <p><strong>Precio:</strong>$${it.price}</p>
      <p><strong>Stock:</strong>${it.quantity}</p>
      <div class="actions">
        <button class="lavanda" onclick="editItem(${idx})">Editar</button>
        <button class="coral" onclick="deleteItem(${idx})">Eliminar</button>
      </div>
    </div>`).join('');
}

/* ---------- preview + compresión ---------- */
function previewImage(ev){
  const file=ev.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement('canvas');
      const max=800, scale=max/img.width;
      canvas.width=max; canvas.height=img.height*scale;
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      const data=canvas.toDataURL('image/jpeg',0.6);
      document.getElementById('imagePreview').src=data;
      document.getElementById('imagePreview').style.display='block';
      document.getElementById('imageData').value=data;
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ---------- guardar / editar ---------- */
document.getElementById('purchaseForm').addEventListener('submit',e=>{
  e.preventDefault();
  const item=Object.fromEntries(new FormData(e.target).entries());
  if(editIndex===-1){               // alta
    addItem(item,()=>{loadAll(); e.target.reset(); document.getElementById('imagePreview').style.display='none';});
  }else{                            // edición
    const updated={...inventory[editIndex],...item};
    putItem(updated,()=>{loadAll(); e.target.reset(); document.getElementById('imagePreview').style.display='none'; editIndex=-1;});
  }
});

/* ---------- editar fila ---------- */
function editItem(idx){
  const it=inventory[idx];
  Object.keys(it).forEach(k=>{const el=document.getElementById(k); if(el)el.value=it[k];});
  if(it.imageData){document.getElementById('imagePreview').src=it.imageData; document.getElementById('imagePreview').style.display='block';}
  editIndex=idx;
}

/* ---------- borrar fila ---------- */
function deleteItem(idx){
  if(!confirm('¿Eliminar producto?'))return;
  delItem(inventory[idx].id,()=>loadAll());
}

/* ---------- vaciar todo ---------- */
function vaciarInventario(){
  if(!confirm('¿Vaciar inventario completo?'))return;
  clearAll(()=>{inventory=[]; renderTable(); calculateTotal();});
}

/* ---------- exportar Excel (sin imagen) ---------- */
function exportToExcel(){
  const ws=XLSX.utils.json_to_sheet(inventory.map(({imageData,id,...rest})=>rest));
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Inventario');
  XLSX.writeFile(wb,'inventario.xlsx');
}

/* ---------- exportar PDF con imágenes ---------- */
async function exportToPDF(){
  const {jsPDF}=window.jspdf; const pdf=new jsPDF('p','mm','a4');
  const pw=pdf.internal.pageSize.getWidth(), m=10, cw=(pw-2*m)/2;
  let x=m, y=m;
  for(let i=0;i<inventory.length;i++){
    const it=inventory[i];
    const div=document.createElement('div');
    div.style.width=cw+'mm'; div.style.padding='10px'; div.style.background='#fff';
    div.style.border='1px solid #ccc'; div.style.borderRadius='12px'; div.style.boxSizing='border-box';
    div.innerHTML=`
      ${it.imageData?`<img src="${it.imageData}" style="width:100%;height:auto;border-radius:8px">`:''}
      <h3 style="margin:8px 0;font-size:14px">${it.name}</h3>
      <p style="margin:2px 0;font-size:12px">Código:${it.code}</p>
      <p style="margin:2px 0;font-size:12px">Precio:$${it.price}</p>
      <p style="margin:2px 0;font-size:12px">Stock:${it.quantity}</p>`;
    document.body.appendChild(div);
    await html2canvas(div,{scale:2}).then(canvas=>{
      const img=canvas.toDataURL('image/png');
      pdf.addImage(img,'PNG',x,y,cw,canvas.height*cw/canvas.width);
      if(i%2===1){y+=canvas.height*cw/canvas.width+10; x=m;}else{x=pw/2+5;}
      if(y>250){pdf.addPage(); y=m; x=m;}
    });
    document.body.removeChild(div);
  }
  pdf.save('inventario_con_imagenes.pdf');
}

/* ---------- importar Excel ---------- */
function importFromExcel(ev){
  const file=ev.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const wb=XLSX.read(e.target.result,{type:'binary'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const data=XLSX.utils.sheet_to_json(ws);
    data.forEach(row=>{
      addItem({...row,imageData:'',discount:row.discount||0},()=>loadAll());
    });
    alert('Importación finalizada');
  };
  reader.readAsBinaryString(file);
}
</script>
</body>
</html>
